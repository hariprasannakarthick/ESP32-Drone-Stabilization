<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#172033">ESP32 Quadcopter Stabilization Architecture</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52627a"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="210" y="75" width="480" height="72" rx="12" fill="#e8f1ff" stroke="#4779b8" stroke-width="2"/>
    <text x="450" y="105" font-size="20" font-weight="bold" fill="#172033">MPU6050 IMU</text>
    <text x="450" y="128" font-size="14" fill="#34445c">Accelerometer + gyroscope measurements</text>
    <line x1="450" y1="147" x2="450" y2="178" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="182" width="480" height="72" rx="12" fill="#f2f5f9" stroke="#7a899d" stroke-width="2"/>
    <text x="450" y="212" font-size="20" font-weight="bold" fill="#172033">Calibration and Sensor Fusion</text>
    <text x="450" y="235" font-size="14" fill="#34445c">Bias correction + complementary filter</text>
    <line x1="450" y1="254" x2="450" y2="285" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="289" width="480" height="66" rx="12" fill="#f2f5f9" stroke="#7a899d" stroke-width="2"/>
    <text x="450" y="316" font-size="20" font-weight="bold" fill="#172033">Attitude / Rate Estimates</text>
    <text x="450" y="338" font-size="14" fill="#34445c">Roll, pitch and yaw rate</text>
    <line x1="450" y1="355" x2="450" y2="386" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="390" width="480" height="72" rx="12" fill="#e8f1ff" stroke="#4779b8" stroke-width="2"/>
    <text x="450" y="420" font-size="20" font-weight="bold" fill="#172033">ESP32 PID Controllers</text>
    <text x="450" y="443" font-size="14" fill="#34445c">Roll / pitch / yaw-rate corrections</text>
    <line x1="450" y1="462" x2="450" y2="493" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="497" width="480" height="62" rx="12" fill="#f2f5f9" stroke="#7a899d" stroke-width="2"/>
    <text x="450" y="534" font-size="20" font-weight="bold" fill="#172033">Motor Mixer + Safety Limits</text>
    <line x1="450" y1="559" x2="450" y2="590" stroke="#52627a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="594" width="480" height="70" rx="12" fill="#e8f6ed" stroke="#39845a" stroke-width="2"/>
    <text x="450" y="624" font-size="20" font-weight="bold" fill="#172033">Four ESCs → Four Brushless Motors</text>
    <text x="450" y="647" font-size="14" fill="#34445c">Motor thrust changes alter aircraft motion</text>
    <path d="M710 630 L790 630 L790 110 L695 110" fill="none" stroke="#52627a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="805" y="370" transform="rotate(-90 805 370)" font-size="14" fill="#34445c">Closed-loop motion feedback</text>
  </g>
  <text x="450" y="712" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5b6575">Conceptual diagram — verify actual firmware and hardware before flight.</text>
</svg>
